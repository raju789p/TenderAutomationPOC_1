# Thresholds and detection rules chosen from the source PDFs' observed font sizes and layout.
heading:
  numbered_pattern: '^([0-9]+(?:\.[0-9]+)*)(?:\.)?\s+(.+)$'
  level_from_number_segments: true
  minimum_font_size_pt: 14.0
page_number:
  minimum_vertical_ratio: 0.90
  maximum_vertical_ratio: 1.0
  digits_pattern: '^[0-9]{1,3}$'
bullet_glyphs: ["•", "▪", "●", "○", "–", "-", "‣", "◦", "\uf0b7"]
table_text_suppression:
  # Suppress individual text lines substantially contained by a table bbox.
  # PyMuPDF can combine table cells and adjacent prose into one text block.
  line_overlap_ratio: 0.5
table_extraction:
  backend: pdfplumber
  vertical_strategy: lines
  horizontal_strategy: lines
  snap_tolerance: 8
  join_tolerance: 8
  intersection_tolerance: 3
bullet_marker_merge_max_gap_pt: 28
element_id_max_per_page: 999
label_maximum_text_length: 100
vector_region:
  minimum_area_pt2: 7200
  minimum_page_area_ratio: 0.015
  table_overlap_ratio: 0.2
  raster_overlap_ratio: 0.5
images:
  adjacency_tolerance_pt: 1.0
  native_rounding_tolerance_px: 1
  validation_dpi: 150
  diagnosis_hash_prefix_chars: 12
render:
  dpi: 100
